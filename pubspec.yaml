name: penguin_code
description: Penguin Code desktop app prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  lucide_icons_flutter: ^3.1.21
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/penguin-chat-wallpaper.png
    - assets/skills/material-3/
    - assets/skills/material-3/references/
